{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if product else 'New' }} Product - Admin{% endblock %}
{% block page_title %}{{ 'Edit' if product else 'New' }} Product{% endblock %}

{% block content %}
<div class="max-w-xl bg-white rounded-2xl shadow-sm p-6">
  <form method="POST" enctype="multipart/form-data" class="space-y-4">

    <!-- Name -->
    <div>
      <label class="block text-xs font-semibold text-gray-500 mb-1">Name <span class="text-red-500">*</span></label>
      <input type="text" name="name" value="{{ product.name if product else '' }}" required
             class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300">
    </div>

    <!-- Description -->
    <div>
      <label class="block text-xs font-semibold text-gray-500 mb-1">Description</label>
      <textarea name="description" rows="3"
                class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300">{{ product.description if product else '' }}</textarea>
    </div>

    <!-- Price + Daily Income -->
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1">Price (K) <span class="text-red-500">*</span></label>
        <input type="number" name="price" step="0.01" min="0"
               value="{{ product.price if product else '' }}" required
               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1">Daily Income (K) <span class="text-red-500">*</span></label>
        <input type="number" name="daily_income" step="0.01" min="0"
               value="{{ product.daily_income if product else '' }}" required
               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300">
      </div>
    </div>

    <!-- Total Income + Rental Days -->
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1">Total Income (K) <span class="text-red-500">*</span></label>
        <input type="number" name="total_income" step="0.01" min="0"
               value="{{ product.total_income if product else '' }}" required
               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1">Rental Days <span class="text-red-500">*</span></label>
        <input type="number" name="rental_days" min="1"
               value="{{ product.rental_days if product else '' }}" required
               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300">
      </div>
    </div>

    <!-- VIP Level -->
    <div>
      <label class="block text-xs font-semibold text-gray-500 mb-1">VIP Level <span class="text-gray-400 font-normal">(leave blank for none)</span></label>
      <input type="number" name="vip_level" min="1" max="10"
             value="{{ product.vip_level if product and product.vip_level else '' }}"
             class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300">
    </div>

    <!-- Image Upload -->
    <div>
      <label class="block text-xs font-semibold text-gray-500 mb-1">
        Product Image
        {% if product and product.image %}
        <span class="text-gray-400 font-normal">(upload a new one to replace)</span>
        {% endif %}
      </label>

      <!-- Current image preview (edit mode only) -->
      {% if product and product.image %}
      <div class="mb-2">
        <img src="{{ product.image }}" alt="{{ product.name }}"
             class="h-40 w-full object-cover rounded-xl border border-gray-200">
      </div>
      {% endif %}

      <!-- Upload dropzone -->
      <div class="border-2 border-dashed border-gray-200 rounded-xl overflow-hidden">
        <label for="image-upload"
               class="flex flex-col items-center gap-2 py-6 cursor-pointer hover:bg-gray-50 transition">
          <div id="preview-wrap" class="hidden w-full px-4">
            <img id="image-preview" class="h-48 w-full object-cover rounded-xl" src="" alt="Preview">
          </div>
          <div id="upload-placeholder" class="flex flex-col items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <p class="text-xs text-gray-400 font-semibold">Click to upload (JPG, PNG, WebP)</p>
          </div>
          <input type="file" id="image-upload" name="image"
                 accept="image/jpeg,image/png,image/webp"
                 class="hidden" onchange="previewImage(this)">
        </label>
      </div>
    </div>

    <!-- Active toggle -->
    <label class="flex items-center gap-2 text-sm font-semibold text-gray-600 cursor-pointer">
      <input type="checkbox" name="is_active"
             {% if not product or product.is_active %}checked{% endif %}
             class="rounded border-gray-300 text-red-600 focus:ring-red-300">
      Active
    </label>

    <!-- Buttons -->
    <div class="flex gap-3 pt-2">
      <button type="submit"
              class="px-6 py-2.5 bg-red-600 text-white font-bold rounded-lg text-sm hover:bg-red-700 transition">
        Save Product
      </button>
      <a href="{{ url_for('admin.products') }}"
         class="px-6 py-2.5 bg-gray-100 text-gray-600 font-bold rounded-lg text-sm hover:bg-gray-200 transition">
        Cancel
      </a>
    </div>

  </form>
</div>

<script>
  function previewImage(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById('image-preview').src = e.target.result;
        document.getElementById('preview-wrap').classList.remove('hidden');
        document.getElementById('upload-placeholder').classList.add('hidden');
      };
      reader.readAsDataURL(input.files[0]);
    }
  }
</script>
{% endblock %}
