{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if item else 'New' }} Article - Admin{% endblock %}
{% block page_title %}{{ 'Edit' if item else 'New' }} Article{% endblock %}

{% block content %}
<div class="max-w-lg bg-white rounded-2xl shadow-sm p-6">
  <form method="POST" enctype="multipart/form-data" class="space-y-4">

    <div>
      <label class="block text-xs font-semibold text-gray-500 mb-1">Title</label>
      <input type="text" name="title" value="{{ item.title if item else '' }}" required
             class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300">
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-500 mb-1">Body</label>
      <textarea name="body" rows="5"
                class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300">{{ item.body if item else '' }}</textarea>
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-500 mb-1">
        Image{% if item and item.image %} <span class="text-gray-400 font-normal">(upload a new one to replace)</span>{% endif %}
      </label>

      <!-- Current image preview -->
      {% if item and item.image %}
      <div class="mb-2">
        <img src="{{ item.image }}" alt="Current image"
             class="h-32 w-full object-cover rounded-lg border border-gray-200">
      </div>
      {% endif %}

      <!-- Upload input -->
      <div class="border-2 border-dashed border-gray-200 rounded-xl overflow-hidden">
        <label for="image-upload" class="flex flex-col items-center gap-2 py-6 cursor-pointer hover:bg-gray-50 transition">
          <div id="preview-wrap" class="hidden w-full px-4">
            <img id="image-preview" class="h-40 w-full object-cover rounded-lg" src="" alt="Preview">
          </div>
          <div id="upload-placeholder" class="flex flex-col items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <p class="text-xs text-gray-400">Click to upload image (JPG, PNG, WebP)</p>
          </div>
          <input type="file" id="image-upload" name="image"
                 accept="image/jpeg,image/png,image/webp"
                 class="hidden" onchange="previewImage(this)">
        </label>
      </div>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit" class="px-6 py-2.5 bg-red-600 text-white font-bold rounded-lg text-sm hover:bg-red-700">Save</button>
      <a href="{{ url_for('admin.news') }}" class="px-6 py-2.5 bg-gray-100 text-gray-600 font-bold rounded-lg text-sm hover:bg-gray-200">Cancel</a>
    </div>

  </form>
</div>

<script>
  function previewImage(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById('image-preview').src = e.target.result;
        document.getElementById('preview-wrap').classList.remove('hidden');
        document.getElementById('upload-placeholder').classList.add('hidden');
      };
      reader.readAsDataURL(input.files[0]);
    }
  }
</script>
{% endblock %}
