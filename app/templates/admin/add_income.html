{% extends "admin/base.html" %}
{% block title %}Add Income - Admin{% endblock %}
{% block page_title %}Add Income Manually{% endblock %}
{% block content %}
<div class="max-w-md bg-white rounded-2xl shadow-sm p-6">
  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-gray-500 mb-1">User Phone</label>
      <input type="text" name="phone" placeholder="e.g. 747430966" required
             class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 mb-1">Product Name</label>
      <input type="text" name="product_name" placeholder="e.g. Solar Panel Pro" required
             class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 mb-1">Amount (K)</label>
      <input type="number" name="amount" step="0.01" min="0" required
             class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 mb-1">Type</label>
      <select name="income_type" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm">
        <option value="product">Product</option>
        <option value="commission">Commission</option>
      </select>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="px-6 py-2.5 bg-red-600 text-white font-bold rounded-lg text-sm">Add Income</button>
      <a href="{{ url_for('admin.income') }}" class="px-6 py-2.5 bg-gray-100 text-gray-600 font-bold rounded-lg text-sm">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
