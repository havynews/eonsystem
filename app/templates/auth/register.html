{% extends "base.html" %}
{% block title %}Register - E.ON System{% endblock %}
{% block bottom_nav %}{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center px-6 py-12 bg-white">
  <!-- Logo -->
  <div class="mb-8 text-center">
    <div class="inline-flex items-center gap-2">
      <span class="text-5xl font-condensed" style="color:#e2001a; font-style:italic; font-weight:900;">e<span style="font-size:0.75em">.</span>on</span>
      <span class="text-lg font-bold text-gray-700 tracking-widest">E.ON-System</span>
    </div>
  </div>

  <div class="w-full max-w-sm">
    <a href="{{ url_for('auth.login') }}" class="inline-flex items-center gap-1.5 text-gray-600 text-sm mb-6 hover:text-eon-red transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      Return
    </a>
    <p class="text-gray-500 text-sm mb-6">Create an account and enjoy all services</p>

    <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
      <div class="flex gap-2">
        <span class="bg-eon-red text-white px-3 rounded-xl font-semibold text-sm flex items-center">+675</span>
        <input
          type="text"
          name="phone"
          placeholder="Enter your mobile phone number"
          required
          class="flex-1 border border-gray-200 rounded-xl px-4 py-3.5 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-eon-red transition"
        />
      </div>
      <input
        type="password"
        name="password"
        placeholder="Enter password"
        required
        class="w-full border border-gray-200 rounded-xl px-4 py-3.5 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-eon-red transition"
      />
      <input
        type="password"
        name="confirm_password"
        placeholder="Re-enter password"
        required
        class="w-full border border-gray-200 rounded-xl px-4 py-3.5 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-eon-red transition"
      />
      <div class="flex gap-2 items-center">
        <input
          type="text"
          name="captcha"
          placeholder="Enter captcha"
          class="flex-1 border border-gray-200 rounded-xl px-4 py-3.5 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-eon-red transition"
        />
        <div class="bg-gray-200 rounded-xl px-4 py-3.5 text-sm font-mono font-bold text-gray-600 select-none">h0rXwF</div>
      </div>

      <button
        type="submit"
        class="btn-eon w-full text-white font-bold py-4 rounded-2xl text-base tracking-wide mt-2 shadow-lg shadow-red-200 transition"
      >
        Register
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="text-eon-red font-semibold hover:underline">Login</a>
    </p>
  </div>
</div>
{% endblock %}
