{% extends "base.html" %}
{% block title %}Password - E.ON System{% endblock %}


{% block content %}
    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background: #EBEBEB;
        font-family: Arial, sans-serif;
        min-height: 100vh;
    }

    /* ── Top logo bar ── */
    .top-bar {
        background: #FFFFFF;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid #ddd;
    }
    .logo {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .logo-eon {
        font-size: 22px;
        font-weight: 900;
        font-style: italic;
        color: #D0021B;
        font-family: Arial Black, Arial, sans-serif;
        letter-spacing: -1px;
    }
    .logo-text {
        font-size: 14px;
        font-weight: 700;
        color: #333;
        letter-spacing: 0.5px;
    }

    /* ── Return link ── */
    .return-row {
        background: #EBEBEB;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 15px;
        color: #222;
        cursor: pointer;
    }
    .return-arrow {
        font-size: 18px;
        color: #222;
    }

    /* ── Form container ── */
    .form-container {
        padding: 16px 16px 30px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    /* ── Blue title button ── */
    .title-btn {
        width: 100%;
        padding: 13px;
        background: #1A6BF5;
        color: #FFFFFF;
        font-size: 16px;
        font-weight: 400;
        border: none;
        border-radius: 4px;
        text-align: center;
        letter-spacing: 0.3px;
    }

    /* ── Field group ── */
    .field-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .field-input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #CCCCCC;
        border-radius: 4px;
        background: #FFFFFF;
        font-size: 15px;
        color: #333;
        outline: none;
        font-family: Arial, sans-serif;
    }
    .field-input:focus {
        border-color: #999;
    }
    .field-label {
        font-size: 13px;
        color: #555;
        font-weight: 400;
        padding-left: 2px;
    }

    /* ── Info notice ── */
    .info-notice {
        background: #FFE4E4;
        border-radius: 4px;
        padding: 12px 14px;
        font-size: 13px;
        color: #333;
        line-height: 1.5;
    }
    .info-notice a {
        color: #1A6BF5;
        text-decoration: none;
    }

    /* ── Confirm button ── */
    .btn-confirm {
        width: 100%;
        padding: 14px;
        background: linear-gradient(180deg, #CC0000 0%, #990000 100%);
        color: #FFFFFF;
        font-size: 16px;
        font-weight: 400;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        letter-spacing: 0.5px;
        box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }
    .btn-confirm:active {
        opacity: 0.9;
    }
    </style>


    <div class="pb-6">


        <!-- Return -->
        <div class="return-row">
           <span class="return-arrow">
                <a href="{{ url_for('profile.profile') }}" 
                class="flex items-center gap-0 text-gray-500 hover:text-eon-red transition">
                    
                    <img src="{{ url_for('static', filename='images/left-arrow.png') }}"
                        onerror="this.style.display='none'"
                        class="w-10 h-10 object-contain" 
                        alt="Back">

                    <span>Return</span>
                </a>
            </span>
            
        </div>

        <!-- Form -->
        <div class="form-container">

            <form method="POST" action="{{ url_for('profile.change_password') }}">
            <!-- Blue title -->
            <div class="title-btn">Change login password</div>

            <!-- Old password -->
            <div class="field-group">
                <input type="password" name="old_password" class="field-input">
                <div class="field-label">Enter your old password</div>
            </div>

            <!-- New password -->
            <div class="field-group">
                <input type="password" name="new_password" class="field-input">
                <div class="field-label">Enter new password</div>
            </div>

            <!-- Confirm new password -->
            <div class="field-group">
                <input type="password" name="confirm_password" class="field-input">
                <div class="field-label">Please re-enter your new password.</div>
            </div>

            <!-- Info notice -->
            <div class="info-notice">
            If you forget your password,please contact <a href="{{ url_for('profile.support') }}">Customer</a> Service
            </div>

            <!-- Confirm button -->
            <button type="submit" class="btn-confirm">Confirm</button>

        </div>

    </div>
{% endblock %}
