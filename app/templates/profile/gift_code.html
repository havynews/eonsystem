{% extends "base.html" %}
{% block title %}Gift Code - E.ON System{% endblock %}



{% block content %}
    <div>

        <style>

            /* ── Return link ── */
            .return-row {
                background: #EBEBEB;
                padding: 12px 16px;
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 15px;
                color: #222;
                cursor: pointer;
            }
            .return-arrow {
                font-size: 18px;
                color: #222;
            }

            /* ── Form container ── */
            .form-container {
                padding: 16px 16px 30px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            /* ── Gift code input ── */
            .gift-input {
                width: 100%;
                padding: 12px;
                border: 1px solid #CCCCCC;
                border-radius: 4px;
                background: #FFFFFF;
                font-size: 15px;
                color: #333;
                outline: none;
                font-family: Arial, sans-serif;
            }
            .gift-input:focus {
                border-color: #999;
            }

            .field-label {
                font-size: 14px;
                color: #444;
                font-weight: 400;
            }

            /* ── Confirm button ── */
            .btn-confirm {
                width: 100%;
                padding: 15px;
                background: linear-gradient(180deg, #CC0000 0%, #990000 100%);
                color: #FFFFFF;
                font-size: 17px;
                font-weight: 400;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                margin-top: 10px;
                letter-spacing: 0.5px;
                box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            }
            .btn-confirm:active {
                opacity: 0.9;
            }
        </style>

        <!-- Return -->
        <div class="return-row">
           <span class="return-arrow">
                <a href="{{ url_for('profile.profile') }}" 
                class="flex items-center gap-0 text-gray-500 hover:text-eon-red transition">
                    
                    <img src="{{ url_for('static', filename='images/left-arrow.png') }}"
                        onerror="this.style.display='none'"
                        class="w-10 h-10 object-contain" 
                        alt="Back">

                    <span>Return</span>
                </a>
            </span>
            
        </div>

        <!-- Form -->
        <div class="form-container">
            <form method="POST" action="{{ url_for('profile.gift_code') }}">
                <input type="text" name="gift_code" class="gift-input" placeholder="">
                <div class="field-label">Enter gift code</div>

                <button type="submit" class="btn-confirm">Confirm</button>
            </form>
        </div>

    </div>
{% endblock %}
